services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    container_name: cosmosdb-emulator
    command: ["--protocol", "https"]
    ports:
      - "8081:8081"
      - "1234:1234"
    environment:
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: true
      CERT_PATH: cosmosdb-emulator.pfx
    volumes:
      - cloudcosmos:/tmp/cosmos
      - ./src/CloudCanvas.Intelligence.Enrichment/.devcontainer/openssl/cosmos-emulator.pfx:/cosmos-emulator.pfx:ro
    restart: unless-stopped

volumes:
  cloudcosmos:
    driver: local