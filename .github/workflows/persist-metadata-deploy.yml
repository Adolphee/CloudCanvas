name: Build and Deploy PersistMetadata Function
on:
  push:
    branches:
      - main
    paths: 
      - 'Functions/PersistMetadata/**'
      - '.github/workflows/persist-metadata-deploy.yml'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4
      - name: 'Setup .NET 8'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 'Cache NuGet Packages'
        id: nuget-cache
        uses: actions/cache@v4
        with:
          path: '~/.nuget/packages'
          key: nuget-${{ runner.os }}-${{ hashFiles('**/**.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
            nuget-
      - name: 'Check if Nuget'
        if: steps.nuget-cache.outputs.cache-hit == false
        run: echo "No cache hit — restoring packages from NuGet.org"
      - name: 'Restore Nuget Packages'
        run: dotnet restore Functions/PersistMetadata/PersistMetadata.csproj
      - name: 'Build'
        run: dotnet build Functions/PersistMetadata/PersistMetadata.csproj --configuration Release --no-restore
      - name: 'Publish'
        run: dotnet publish Functions/PersistMetadata/PersistMetadata.csproj --configuration Release --output ./publish
      - name: 'Deploy to Azure Functions App'
        uses: azure/functions-action@v1
        with:
          app-name: ${{ secrets.APP_NAME_B }}
          publish-profile: ${{ secrets.PP_B }}
          package: ./publish
