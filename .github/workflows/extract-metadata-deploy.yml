name: Build and Deploy ExtractMetadata Function
on: 
    push:
        branches:
            - main
        paths:
            - 'ExtractMetadata/**'
            - '.github/workflows/extract-metadata-deploy.yml'
    pull_request: 
        branches:
            - main
jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: 'Checkout Code'
              uses: actions/checkout@4
            - name: 'Setup .NET'
              uses: actions/setup-dotnet@4
              with: 
                dotnet-version: '8.0.x'
            - name: 'Cache or Download Nuget Packages'
              id: cache-nuget-packages
              uses: actions/cache@4
              with:
                path: ~/.nuget/packages
                key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
                restore-keys: |
                  nuget-${{ runner.os }}
                  nuget-
            - name: 'Check if NuGet Cache was restored'
              if: steps.cache-nuget-packages.outputs.cache-hit != 'true'
              run: echo "No cache hit — restoring packages from NuGet.or"
            - name: 'Restore Dependencies'
              run: dotnet restore ExtractMetadata.csproj
            - name: 'Build'
              run: dotnet build ExtractMetadata.csproj --configuration Release --no-restore
            - name: 'Publish'
              run: dotnet publish ExtractMetadata.csproj --configuration Release --output ./publish
            - name: 'Deploy to Azure Fuctions App'
              uses: Azure/functions-action@1
              with:
                app-name: ${{ secrets.APP_NAME_A }}
                publish-profile: ${{ secrets.PP_A }}
                package: ./publish