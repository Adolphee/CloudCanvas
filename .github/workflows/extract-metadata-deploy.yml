name: Build and Deploy ExtractMetadata Function
on: 
    push:
        branches:
            - main
        paths:
            - 'Functions/ExtractMetadata/**'
            - '.github/workflows/extract-metadata-deploy.yml'
    pull_request:
        branches:
            - main
jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - project : 'Functions/ExtractMetadata/ExtractMetadata.csproj'
                    - target: '--configuration Release'
        steps:
            - name: 'Checkout Code'
              uses: actions/checkout@v4
            - name: 'Setup .NET'
              uses: actions/setup-dotnet@v4
              with: 
                dotnet-version: '8.0.x'
            - name: 'Cache or Download Nuget Packages'
              id: cache-nuget-packages
              uses: actions/cache@v4
              with:
                path: ~/.nuget/packages
                key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
                restore-keys: |
                  nuget-${{ runner.os }}
                  nuget-
            - name: 'Check if NuGet Cache was restored'
              if: steps.cache-nuget-packages.outputs.cache-hit != 'true'
              run: echo "No cache hit — restoring packages from NuGet.or"
            - name: 'Restore Dependencies'
              run: dotnet restore ${{ matrix.project }}
            - name: 'Build'
              run: dotnet build ${{ matrix.project }} ${{ matrix.target }} --no-restore
            - name: 'Publish'
              run: dotnet publish ${{ matrix.project }} ${{ matrix.target }} --output ./publish
            - name: 'Deploy to Azure Fuctions App'
              uses: Azure/functions-action@v1
              with:
                app-name: ${{ secrets.APP_NAME_A }}
                publish-profile: ${{ secrets.PP_A }}
                package: ./publish