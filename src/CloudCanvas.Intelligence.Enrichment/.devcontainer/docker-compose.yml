services:
  cloudcanvas-dev:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../../:/workspaces:cached
    command: sleep infinity

  cosmosdb:
    hostname: cosmosdb
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    command: ["--protocol", "https"]
    ports:
      - "8081:8081"
      - "1234:1234"
    environment:
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: true
      CERT_PATH: /cosmos-emulator.pfx # Generated by openssl in .devcontainer/openssl/cosmos-emulator.pfx
      CERT_SECRET: "root" # LOCAL DEV ONLY - USE SECRETS OR KEYVAULT IN PRODUCTION
      PROTOCOL: "https"
    volumes:
      - cosmosdb-data:/tmp/cosmos
      - ./openssl/cosmos-emulator.pfx:/cosmos-emulator.pfx:ro
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    restart: unless-stopped
  
  sqlserver:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "CloudCanvas#2026" # LOCAL DEV ONLY - USE SECRETS OR KEYVAULT IN PRODUCTION
      MSSQL_DB: "CloudCanvas.Identity"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      
volumes:
  cosmosdb-data:
    driver: local
  sqlserver-data:
  azurite-data:
    driver: local