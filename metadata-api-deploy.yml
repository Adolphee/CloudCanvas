trigger:
  branches:
    include: [ azure-pipelines ]

pool:
  name: Default

variables:
- group: lib-metadata-api

steps:
- checkout: self

# Setup .NET SDK
- task: UseDotNet@2
  displayName: 'Setup .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '$(DOTNET_VERSION)'

# Cache NuGet
- task: Cache@2
  displayName: 'Cache NuGet packages'
  inputs:
    key: 'nuget | "$(Agent.OS)" | **/BlobsMetadataAPI.csproj'
    restoreKeys: |
      nuget | "$(Agent.OS)"
      nuget
    path: '$(NUGET_PACKAGES)'

# Build & publish API Function
- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: "$(PROJECT_PATH)"
    feedsToUse: 'select'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: "$(PROJECT_PATH)"
    arguments: '--configuration Release --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Publish'
  inputs:
    command: 'publish'
    projects: "$(PROJECT_PATH)"
    publishWebProjects: false
    arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/publish --no-build'

# Set app settings to Key Vault *references* so CI never sees values

- task: AzureCLI@2
  displayName: 'Configure KV references on Function App'
  inputs:
    azureSubscription: "$(AZURE_SUB)"
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az functionapp config appsettings set \
        --name "$(APP_NAME)" \
        --resource-group "$(RESOURCE_GROUP)" \
        --settings \
          "MNSTRG=@Microsoft.KeyVault(SecretUri=$(MNSTRG))" \
          "MTSTRG=@Microsoft.KeyVault(SecretUri=$(MTSTRG))" \
          "FUMSGO=@Microsoft.KeyVault(SecretUri=$(FUMSGO))" \
          "FUMSGI=@Microsoft.KeyVault(SecretUri=$(FUMSGI))" \
          "AzureWebJobsStorage=@Microsoft.KeyVault(SecretUri=$(AZWJS))"

# Deploy zip package (no publish profile needed)
- task: AzureCLI@2
  displayName: 'Zip deploy'
  inputs:
    azureSubscription: '$(AZURE_SUB)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      cd "$(Build.ArtifactStagingDirectory)/publish"
      zip -r ../app.zip .
      az functionapp deployment source config-zip \
        --resource-group "$(RESOURCE_GROUP)" \
        --name "$(APP_NAME)" \
        --src "$(Build.ArtifactStagingDirectory)/app.zip"